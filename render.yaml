services:
  - type: web
    name: hizli-satis
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: SqlServer__Server
        sync: false
      - key: SqlServer__Port
        value: "1433"
      - key: SqlServer__MasterDatabase
        value: HizliSatisMaster
      - key: SqlServer__User
        sync: false
      - key: SqlServer__Password
        sync: false
      - key: Jwt__Key
        generateValue: true
