services:
  db:
    image: postgres:16-alpine
    container_name: hizlisatis-postgres
    environment:
      POSTGRES_USER: hizlisatis
      POSTGRES_PASSWORD: hizlisatis
      POSTGRES_DB: hizlisatis_master
    ports:
      - "5432:5432"
    volumes:
      - hizlisatis_pgdata:/var/lib/postgresql/data

volumes:
  hizlisatis_pgdata:
